plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.salarymanagement'
version = '0.0.1-SNAPSHOT'
description = 'salary-management'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('seedDemoData', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Populates the database with 10,000 deterministic fictional employees and compensation history.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.salarymanagement.salarymanagement.SalaryManagementApplication'
    args = ['--seed.demo-data.enabled=true', '--seed.demo-data.exit-after-seed=true']
}

tasks.register('resetAndSeedDemoData', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Resets existing demo employees and re-populates with 10,000 deterministic fictional employees.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.salarymanagement.salarymanagement.SalaryManagementApplication'
    args = ['--seed.demo-data.enabled=true', '--seed.demo-data.reset=true', '--seed.demo-data.confirm=true', '--seed.demo-data.exit-after-seed=true']
}
